; Límites de subida de PHP para HuriosCan — capa de entorno de QA-F-03 (AUT-03).
;
; Estos valores NO son el límite del producto. El límite del producto son 15 MB
; (docs/contratos/digitalizacion.md) y lo aplica el servicio de dominio, que es
; la única capa capaz de rechazar hoja por hoja, explicar el motivo en español y
; conservar el resto del lote.
;
; PHP trabaja sobre la petición completa: si el cuerpo supera post_max_size,
; descarta la petición entera antes de que la aplicación se ejecute — $_POST y
; $_FILES llegan vacíos y el servidor responde 413 sin que el dominio se entere.
; Verificado con una subida real: con los valores de la máquina (2M/8M), una
; hoja de 13 MB produce HTTP 413 y el lote se pierde sin motivo visible, que es
; exactamente el defecto QA-F-03.
;
; Por eso cada capa por debajo del dominio debe permitir MÁS que 15 MB, nunca lo
; mismo: el caso que hay que dejar funcionar es justamente el de la hoja que
; excede el límite del producto, porque debe llegar al dominio para que él la
; rechace con su mensaje.
;
; El papel de esta capa es el de techo duro contra abuso de recursos: al no
; haber tope por encima, es la única defensa frente a una petición enorme.
;
; post_max_size va por encima de upload_max_filesize porque una captura puede
; enviar varias hojas en la misma petición, y ahí los tamaños sí se suman.
;
; Cómo se aplica: no se edita el php.ini de cada máquina. Se carga vía
; PHP_INI_SCAN_DIR, que sí se hereda a los procesos hijos de PHP (el servidor
; embebido que levanta `artisan serve` es uno; los ajustes pasados con `php -d`
; no se heredarían). Usar scripts/servir-desarrollo.sh. En CI se aplican los
; mismos valores con `ini-values` de setup-php.
;
; Cuando exista un servidor web (nginx/Apache + php-fpm), su propio límite de
; cuerpo — `client_max_body_size` en nginx, `LimitRequestBody` en Apache — debe
; alinearse con post_max_size de aquí, o volverá a cortar antes que el dominio.

upload_max_filesize=50M
post_max_size=60M
