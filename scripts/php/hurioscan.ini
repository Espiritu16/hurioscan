; Límites de subida de PHP para HuriosCan — capa de entorno de QA-F-03 (AUT-03).
;
; Estos valores NO son el límite del producto. El límite del producto son 15 MB
; (docs/contratos/digitalizacion.md) y lo aplica el servicio de dominio, que es
; la única capa capaz de rechazar hoja por hoja, explicar el motivo en español y
; conservar el resto del lote.
;
; PHP trabaja sobre la petición completa: si el cuerpo supera post_max_size,
; descarta la petición entera antes de que la aplicación se ejecute — $_POST y
; $_FILES llegan vacíos y el servidor responde 413 sin que el dominio se entere.
; Verificado con una subida real: con los valores de la máquina (2M/8M), una
; hoja de 13 MB produce HTTP 413 y el lote se pierde sin motivo visible, que es
; exactamente el defecto QA-F-03.
;
; Por eso cada capa por debajo del dominio debe permitir MÁS que 15 MB, nunca lo
; mismo: el caso que hay que dejar funcionar es justamente el de la hoja que
; excede el límite del producto, porque debe llegar al dominio para que él la
; rechace con su mensaje.
;
; El papel de esta capa es el de techo duro contra abuso de recursos: al no
; haber tope por encima, es la única defensa frente a una petición enorme.
;
; post_max_size va por encima de upload_max_filesize porque una captura puede
; enviar varias hojas en la misma petición, y ahí los tamaños sí se suman.
;
; Cómo se aplica: no se edita el php.ini de cada máquina. Se carga vía
; PHP_INI_SCAN_DIR, que sí se hereda a los procesos hijos de PHP (el servidor
; embebido que levanta `artisan serve` es uno; los ajustes pasados con `php -d`
; no se heredarían). Usar scripts/servir-desarrollo.sh. En CI se aplican los
; mismos valores con `ini-values` de setup-php.
;
; Cuando exista un servidor web (nginx/Apache + php-fpm), su propio límite de
; cuerpo — `client_max_body_size` en nginx, `LimitRequestBody` en Apache — debe
; alinearse con post_max_size de aquí, o volverá a cortar antes que el dominio.

; max_file_uploads es la misma familia de defecto, y la más traicionera: al
; superarlo PHP entrega las primeras N y descarta el resto EN SILENCIO. Medido
; con 25 hojas y el valor por defecto de 20: llegan 20, se pierden 5, y el aviso
; queda en el log del servidor — la aplicación recibe 20 y no tiene forma de
; saber que faltaban. El operador vería capturadas menos hojas de las que
; seleccionó, sin ningún error. En un folder clínico eso es pérdida de trabajo
; real e indetectable.
;
; Ningún requisito fija un tope de hojas por sesión (RF-003 no lo limita), así
; que 20 no era un límite de producto sino un valor por defecto que nadie
; eligió. Este tampoco lo es: es un techo contra abuso, con holgura sobre
; cualquier folder plausible. El tope real de bytes lo sigue poniendo
; post_max_size.

; display_errors cierra QA-F-04. Los avisos que PHP emite ANTES de arrancar el
; código (los "Request Startup", como el de max_file_uploads) se imprimen dentro
; del cuerpo de la respuesta si display_errors está On, que es el valor por
; defecto de la máquina. Medido: la respuesta sale como
;     <br /><b>Warning</b>: … <br />{"paths":[…]}
; El JSON es correcto pero va precedido de HTML, así que el parseo del cliente
; falla ("Unexpected token '<'") y la subida entera se pierde sin que el operador
; vea nada. Ni Laravel ni la aplicación pueden evitarlo: esos avisos ocurren
; antes de que se ejecute una sola línea de código, así que solo se corrigen aquí.
;
; No se pierde visibilidad al ponerlo en Off. Laravel ya fuerza display_errors=Off
; al arrancar aunque APP_DEBUG sea true (verificado): lo que muestra los errores
; en desarrollo es APP_DEBUG, no esta directiva. Lo único que cambia es esa
; ventana previa al arranque, que es justamente donde vive el defecto.
;
; Y no se silencian: log_errors los manda al log de errores, que para el servidor
; de desarrollo es stderr — quedan a la vista en la terminal donde se arrancó,
; fuera del cuerpo de la respuesta. Es la misma convención de logs a stderr que
; ya declara AGENTS.md.

display_errors=Off
log_errors=On

upload_max_filesize=50M
post_max_size=60M
max_file_uploads=200
